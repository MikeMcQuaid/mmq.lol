name: GitHub Actions CI
on:
  push:
    branches:
      - tests
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: Homebrew/actions/setup-ruby@main
        with:
          bundler-cache: true
          setup-homebrew: true

      - name: Run HTML Proofer tests
        run: bundle exec rake
